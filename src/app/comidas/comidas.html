<section class="seccionTitulo">
  <div class="container">
    <div class="row align-items-center">

        <div class="col-md-6 divTitulo">
            <h1>☆ Nuestros platillos ☆</h1>
        </div>

        <div class="col-md-6 divBusqueda">
            <form class="d-flex barraBusqueda">
                <input class="form-control me-2" type="text" placeholder="Buscar" #textoBusqueda>
                <select class="form-select me-2" #tipoBusqueda style="max-width: 160px;">
                  <option value="nombre">Por nombre</option>
                  <option value="ingrediente">Por ingrediente</option>
                </select>
                <button class="btn botonBuscar" type="button"
                  (click)="tipoBusqueda.value === 'nombre' ? buscarPorNombre(textoBusqueda.value) : buscarPorIngrediente(textoBusqueda.value)">
                  Buscar
                </button>
            </form>
        </div>

    </div>
  </div>
</section>

<div class="container">
  <div class="d-flex flex-wrap gap-2 mb-4">

    @for (cat of categorias(); track cat.idCategory) {
      <button class="btn"
        [class.btn-primary]="categoriaActual() === cat.strCategory"
        [class.btn-outline-primary]="categoriaActual() !== cat.strCategory"
        (click)="cargarComidasPorCategoria(cat.strCategory)">
        {{ cat.strCategory }}
      </button>
    }
  </div>

  <div class="row g-4">
    @for (p of platos(); track p.id) {
    <div class="col-12 col-sm-6 col-md-4">
      <app-tarjeta-plato [plato]="p"></app-tarjeta-plato>
    </div>
    }
  </div>
</div>
